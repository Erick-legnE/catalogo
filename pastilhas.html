<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil Botões — Pastilhas</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --primary: #00bad2;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 3rem; }

        header {
            background: #1e293b;
            color: #fff;
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title { font-size: 1.5rem; font-weight: 900; }
        .header-title span { color: var(--primary); }

        .search-box { width: 100%; margin-top: 0.75rem; }

        .search-input {
            width: 100%;
            padding: 0.75rem 1.25rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input::placeholder { color: #94a3b8; }
        .search-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.2); }

        .grid {
            max-width: 1200px;
            margin: 2rem auto 0;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

.carousel-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #ffffff; /* Clean white background */
    overflow: hidden;
    border-bottom: 1px solid var(--border);
}

.carousel-track img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Keeps full item shape without cropping edges */
    flex-shrink: 0;
    padding: 8px; /* Breathing room inside card */
}

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-btn:hover { opacity: 1; }
        .nav-btn.prev { left: 8px; }
        .nav-btn.next { right: 8px; }

        .photo-indicator {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-info { padding: 1rem; text-align: center; }
        .color-code { font-size: 1.1rem; font-weight: 900; color: var(--primary); }

        /* PAGINATION BUTTON */
        .load-more-container {
            text-align: center;
            margin: 2.5rem 0;
        }

        .btn-load-more {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 186, 210, 0.3);
            transition: all 0.2s ease;
        }

        .btn-load-more:hover {
            transform: translateY(-2px);
            background: #0099ad;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1 class="header-title">Brasil <span>Botões</span> — Pastilhas</h1>
            <div class="search-box">
                <input type="text" id="search" class="search-input" placeholder="Buscar por código (ex: C001, C15)..." oninput="executarBusca()">
            </div>
        </div>
    </header>

    <main class="grid" id="pastilhas-grid"></main>

    <div class="load-more-container" id="load-container">
        <button class="btn-load-more" onclick="carregarMais()">Carregar mais pastilhas</button>
    </div>

    <script>
        const BATCH_SIZE = 30;
        let todosDados = [];
        let dadosFiltrados = [];
        let ponteiroAtual = 0;

        async function carregarJSON() {
            try {
                const res = await fetch('pastilhas.json');
                todosDados = await res.json();
                dadosFiltrados = [...todosDados];
                
                renderizarLote(true);
            } catch (e) {
                console.error("Erro ao carregar 'pastilhas.json'. Execute 'gerar_pastilhas_json.py' primeiro.", e);
            }
        }

        function renderizarLote(reset = false) {
            const grid = document.getElementById('pastilhas-grid');
            if (reset) {
                grid.innerHTML = '';
                ponteiroAtual = 0;
            }

            const proximoLote = dadosFiltrados.slice(ponteiroAtual, ponteiroAtual + BATCH_SIZE);

            proximoLote.forEach((item, idxAbs) => {
                const idx = ponteiroAtual + idxAbs;
                const hasMultiple = item.imagens.length > 1;

                const cardHtml = `
                    <div class="card">
                        <div class="carousel-container">
                            <div class="carousel-track" id="track-${idx}">
                                ${item.imagens.map(img => `<img src="${img}" alt="${item.cor_codigo}">`).join('')}
                            </div>
                            ${hasMultiple ? `
                                <button class="nav-btn prev" onclick="moveSlide(${idx}, -1)">❮</button>
                                <button class="nav-btn next" onclick="moveSlide(${idx}, 1)">❯</button>
                                <span class="photo-indicator" id="indicator-${idx}">1/${item.imagens.length}</span>
                            ` : ''}
                        </div>
                        <div class="card-info">
                            <div class="color-code">${item.cor_codigo}</div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });

            ponteiroAtual += BATCH_SIZE;

            // Toggle "Carregar Mais" button visibility
            const btnContainer = document.getElementById('load-container');
            btnContainer.style.display = (ponteiroAtual < dadosFiltrados.length) ? 'block' : 'none';
        }

        function carregarMais() {
            renderizarLote(false);
        }

        // Smart Search Handler
        function executarBusca() {
            const query = document.getElementById('search').value.toLowerCase().trim();

            if (!query) {
                dadosFiltrados = [...todosDados];
            } else {
                dadosFiltrados = todosDados.filter(item => {
                    const code = item.cor_codigo.toLowerCase();
                    const numOnly = code.replace(/\D/g, '');

                    // Checks full code "C001", raw number "1", or substring match
                    return code.includes(query) || numOnly.includes(query);
                });
            }

            renderizarLote(true);
        }

        // Carousel Slider Logic
        const carouselStates = {};

        function moveSlide(cardIdx, direction) {
            const track = document.getElementById(`track-${cardIdx}`);
            const indicator = document.getElementById(`indicator-${cardIdx}`);
            if (!track) return;

            const totalImages = track.children.length;

            if (!(cardIdx in carouselStates)) carouselStates[cardIdx] = 0;

            carouselStates[cardIdx] = (carouselStates[cardIdx] + direction + totalImages) % totalImages;
            const currentIdx = carouselStates[cardIdx];

            track.style.transform = `translateX(-${currentIdx * 100}%)`;
            if (indicator) indicator.textContent = `${currentIdx + 1}/${totalImages}`;
        }

        carregarJSON();
    </script>
</body>
</html>
